<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#13264b" />
  <title>City Breaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="floats"></div>

    <header id="hud">
      <div class="title-pill">CITY BREAKER</div>
      <div class="phase-box">
        <div class="phase-pill" id="phasePill">1 • CONNECT</div>
        <div class="timer-pill">
          <svg viewBox="0 0 24 24" class="clock"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 7v5.5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          <span id="timerText">CONNECT • 30s</span>
        </div>
      </div>
      <div class="brick-pill"><i class="brick"></i><span id="brickCount">20</span></div>
    </header>

    <div id="hudRow2">
      <div class="team-chip blue">YOU <b id="blueCount">1</b></div>
      <div class="hud-btns">
        <button id="pauseBtn" class="round-btn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
        <button id="restartBtn" class="round-btn" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M19.5 3.5v5h-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="helpBtn" class="round-btn" aria-label="How to play">?</button>
      </div>
      <div class="team-chip red">CPU <b id="redCount">1</b></div>
    </div>

    <div id="bubble" class="bubble hidden"></div>
    <div id="hand" class="hand hidden">👆</div>
    <div id="toast" class="toast"></div>

    <section id="panel">
      <div id="panelTitle">CONNECT • DRAG A PATH</div>
      <div id="panelBody"></div>
      <button id="endBtn">END TURN</button>
    </section>

    <div id="modal" class="modal">
      <div class="modal-box" id="modalBox"></div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
